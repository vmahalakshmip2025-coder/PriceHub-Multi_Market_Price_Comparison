# ==========================================================
# PriceHub Application Configuration
# ==========================================================
spring.application.name=PriceHub
server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/pricehub_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Replace with your local MySQL password
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.pricehub=INFO
logging.level.org.hibernate.SQL=WARN